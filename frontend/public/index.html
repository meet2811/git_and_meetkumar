<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Fullstack App</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-container { border: 1px solid #ccc; padding: 20px; max-width: 300px; }
        #responseMessage { margin-top: 15px; color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Submit to Flask Backend</h2>
    <div class="form-container">
        <form id="userForm">
            <label>Name:</label><br>
            <input type="text" id="name" required><br><br>
            
            <label>Email:</label><br>
            <input type="email" id="email" required><br><br>
            
            <button type="submit">Submit</button>
        </form>
    </div>
    <div id="responseMessage"></div>

    <script>
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            try {
                // Fetching data from the Flask container exposed on port 5000
                const response = await fetch('http://localhost:5000/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });
                
                const data = await response.json();
                document.getElementById('responseMessage').innerText = data.message;
            } catch (error) {
                document.getElementById('responseMessage').innerText = 'Error connecting to the backend.';
                document.getElementById('responseMessage').style.color = 'red';
            }
        });
    </script>
</body>
</html>
